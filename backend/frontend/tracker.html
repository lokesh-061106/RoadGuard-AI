<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Tracker - RoadGuard AI</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-container">
    <nav class="navbar">
      <div class="nav-container">
        <a href="/" class="nav-brand">🛡️ RoadGuard <span>AI</span></a>
        <ul class="nav-menu" id="nav-menu-links"></ul>
        <div class="nav-auth" id="nav-auth-container"></div>
      </div>
    </nav>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Incident Tracker</h1>
        <p class="page-subtitle">Track the resolution progress and AI assessments of any submitted incident report.</p>
      </div>

      <!-- Search bar -->
      <div class="glass-panel" style="display:flex; gap:1rem; align-items:center; max-width:600px; margin:0 auto 2rem auto;">
        <input type="text" id="tracker-search-input" class="form-input" placeholder="Enter Incident ID (e.g. inc_1624...)" style="flex:1;">
        <button id="tracker-search-btn" class="btn btn-primary" style="padding:0.75rem 1.5rem;">Track Incident</button>
      </div>

      <!-- Search result display panel -->
      <div id="tracker-result-container">
        <div class="glass-panel" style="text-align:center; padding:3rem;">
          <h3 style="color:var(--text-muted);">Enter an Incident ID above to track its maintenance status.</h3>
          <p style="font-size:0.9rem; color:var(--text-muted); margin-top:0.25rem;">You can find your reported incident IDs in your citizen profile dashboard.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
