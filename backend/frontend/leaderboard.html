<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - RoadGuard AI</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-container">
    <nav class="navbar">
      <div class="nav-container">
        <a href="/" class="nav-brand">🛡️ RoadGuard <span>AI</span></a>
        <ul class="nav-menu" id="nav-menu-links"></ul>
        <div class="nav-auth" id="nav-auth-container"></div>
      </div>
    </nav>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Citizen Leaderboard</h1>
        <p class="page-subtitle">Praising the top citizen surveyors whose vigilance secures our national infrastructure.</p>
      </div>

      <div class="glass-panel" style="padding:0; overflow-x:auto;">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th style="width:100px;">Rank</th>
              <th>Surveyor Name</th>
              <th>Points Earned</th>
              <th>Milestone Badges</th>
            </tr>
          </thead>
          <tbody id="leaderboard-tbody">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
